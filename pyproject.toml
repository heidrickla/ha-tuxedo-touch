[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The test file is a linear check script rather than a module.
"tests/*" = ["S101", "E501"]

# Home Assistant runs mypy in strict mode over integrations claiming the
# strict-typing rule. This block is the real strict configuration and it is
# what the Tests workflow runs with Home Assistant installed. A local run
# without Home Assistant sees every class it exports as Any, so it reports
# subclassing-Any and the `domain=` keyword on ConfigFlow; those are artifacts
# of the missing package, not defects, and CI is the run that counts.
[tool.mypy]
# Home Assistant 2026.x is written for 3.14; a lower target makes mypy stop
# at its own source before reaching this integration.
python_version = "3.14"
# Nothing is switched off underneath this: no ignore_missing_imports, no
# relaxed error codes, no per-file escape for the integration itself.
strict = true
# Third-party code is analysed but its own errors are not reported, the way
# Home Assistant core runs mypy. It decides which FILES are reported on, not
# how strictly this integration is checked.
follow_imports = "silent"

# getmac ships no type information and no stub package exists, so mypy can
# find no stub for that one import. Scoped to it: what it returns is
# annotated at the call site in identity.py.
[[tool.mypy.overrides]]
module = ["getmac", "getmac.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
strict = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
