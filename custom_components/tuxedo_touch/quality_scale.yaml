rules:
  # Bronze
  action-setup:
    status: exempt
    comment: |
      This integration registers no actions of its own. Arming and disarming
      go through the alarm_control_panel domain's actions.
  appropriate-polling:
    status: done
    comment: |
      Thirty seconds, and since 0.4.0 the poll is the fallback rather than
      the source. The panel pushes partition status on its event stream as it
      happens, so while that stream is connected the poll only proves the
      panel is still answering and its reading is not written over what was
      pushed. It is still the first read at setup - the one that proves the
      address, the scheme and the credentials - and it is the only source on
      firmware that does not serve the stream. Thirty seconds suits that
      role: the panel is an embedded web server paying for a legacy TLS
      handshake on every new connection, and no command waits for a poll to
      be seen.
  brands:
    status: done
    comment: |
      Brand images ship in-repo at custom_components/tuxedo_touch/brand/,
      which Home Assistant serves from 2026.3 on; hacs.json floors there.
  common-modules: done
  config-flow-test-coverage:
    status: done
    comment: |
      tests/ha/test_config_flow.py covers the user step, the four error
      mappings and recovery from an error to a created entry, the duplicate
      abort, a second partition, reconfigure (address and partition changes,
      recovery from an error, the collision guard, blank secrets keeping the
      stored ones, the title following a move, the stored MAC surviving, the
      stand-down for a polling and a retrying entry, and a stalled poll
      holding the check off the panel until it finishes),
      reauth in both outcomes including recovery, and every branch of the
      dhcp step: a new panel through its confirm step to a created entry,
      that step recovering from a wrong password and dropping an emptied
      code, a second lease finding the form already open, a configured panel
      moving, a hand-added entry adopting the MAC and the collision that
      raises the duplicate-entry issue instead. Run by the GitHub Tests
      workflow on every push.
  config-flow:
    status: done
    comment: Every field has a data_description; the secrets use a password selector.
  dependency-transparency:
    status: done
    comment: |
      One requirement is left: cryptography, open source and on PyPI. It is
      declared unpinned on purpose - Home Assistant core pins it and
      constrains every install to that pin, so any other version here would
      refuse to install on the next core release. The panel's own client is
      in this repository.
  docs-actions:
    status: exempt
    comment: This integration registers no actions of its own.
  docs-conditions:
    status: exempt
    comment: This integration provides no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: This integration provides no triggers.
  entity-event-setup:
    status: done
    comment: |
      The entity is a CoordinatorEntity, which subscribes to the coordinator
      in async_added_to_hass and unsubscribes on removal. Nothing else is
      subscribed to: the push stream belongs to the coordinator, which runs
      it as a background task on the config entry and cancels it on unload,
      so no entity holds a subscription of its own.
  entity-unique-id: done
  has-entity-name:
    status: done
    comment: |
      The entity is named "Partition N" under the device name. Two partition
      entries on one panel are two devices with the same name (one device per
      config entry since HA 2026.8), so the partition in the entity name is
      what tells the two alarms apart.
  runtime-data: done
  test-before-configure:
    status: done
    comment: The flow performs a real login before the entry is created.
  test-before-setup:
    status: done
    comment: |
      async_config_entry_first_refresh raises ConfigEntryNotReady while the
      panel is unreachable and ConfigEntryAuthFailed when it refuses the
      credentials. The one first-refresh failure that does not hold setup
      back is the firmware answering "Not available" instead of a status:
      that reply has already proved the address, the scheme and the login,
      so the entry loads with its entity unavailable and corrects itself on
      the next real status, rather than taking the device and its history
      away for an outage this unit can hold for hours.
  unique-config-entry:
    status: done
    comment: |
      The panel's MAC plus the partition where a DHCP lease has supplied one,
      the address plus the partition otherwise; a same-panel re-add is also
      caught on the stored connection data before any network traffic, and a
      lease that would give two entries the same MAC identity raises the
      duplicate-entry repair issue instead of taking the id.

  # Silver
  action-exceptions: done
  config-entry-unloading:
    status: done
    comment: |
      Platforms are unloaded and the session is released by an on_unload
      callback. async_unload_entry additionally cancels the push stream's
      task and awaits the cancellation - the stream is a request that never
      ends by itself, so nothing short of that closes it - and then awaits
      the coordinator's poll lock, because unloading cancels the next poll
      but not one already in flight and that poll holds the panel's single
      connection. A caller that has awaited the unload can therefore treat
      the panel as free, which the reconfigure flow does before it checks new
      settings.
  docs-configuration-parameters:
    status: exempt
    comment: No options flow; the connection details are edited by reconfigure.
  docs-installation-parameters: done
  entity-unavailable:
    status: done
    comment: |
      Two sources, so availability is not the CoordinatorEntity default: the
      entity is available while the push stream has a status to show OR the
      last poll succeeded, and unavailable only when both are down
      (TuxedoTouchCoordinator.panel_available). The stream counts once it has
      delivered rather than once its socket is open, so an entry loading
      during an outage stays unavailable for the second before the first
      frame instead of reading "unknown" with nothing behind it. Every way a
      read can fail
      still fails the poll, the firmware's "Not available" answer included -
      that is a read that returned no status rather than a status - but a
      poll answering it while the stream is delivering real statuses is not
      an outage of anything, and the stream cannot produce that answer at
      all. Nothing publishes the placeholder or presents the last good state
      as current.
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: |
      Once per outage per source, and once on recovery. The coordinator logs
      an unreachable panel once via UpdateFailed; a panel answering "Not
      available" instead of a status is the same shape and gets one info line
      naming the quirk when the outage starts and one when a real status
      returns - including when the status that ends it arrives on the stream
      rather than a poll - rather than one line per 30 s poll for as long as
      it runs, which on this unit can be hours. The push stream is logged the
      same way: one info line when it drops, one when it is connected again,
      not one per reconnect attempt, and one line for firmware that answers
      404 and therefore has no stream at all.
  parallel-updates: done
  reauthentication-flow: done
  test-coverage:
    status: done
    comment: |
      The Tests workflow runs the whole suite under coverage on every push
      and fails below 95% (`--cov-fail-under=95`); it measures 99%.
      tests/test_client_io.py covers the client's login, key fetch and call
      paths through a session stand-in; tests/ha covers setup, the entity,
      the config flow, diagnostics, identity, the repair issues, the
      in-flight poll discard, the "Not available" answer on the first poll
      and on a later one with its recovery, and a stalled poll holding the
      reconfigure check off the panel until it finishes.
      tests/fake_panel.py stands a real server up on 127.0.0.1 speaking the
      panel's whole wire format, so tests/test_push_stream.py and
      tests/ha/test_push.py drive the actual request, multipart reading,
      frame decoding, reconnect and re-login rather than a mock of them: the
      stream becoming the state source, the exit-delay countdown, a poll not
      written over a pushed status, an unrecognised text letting the poll
      settle the mode, availability with each source failing in turn, a
      command confirmed by the stream, one falling back to a poll, one
      nothing confirms, and an unload leaving no task behind. The two frame
      payloads from the live capture are asserted byte for byte with utf-8 as
      the positive control. tools/validate_local.py refuses a workflow that
      drops the gate.

  # Gold
  devices:
    status: done
    comment: |
      One device per entry: the panel, named for it, manufacturer Honeywell,
      model "Tuxedo Touch WIFI", configuration_url pointing at the unit's own
      web UI, and the MAC as a CONNECTION_NETWORK_MAC connection wherever a
      DHCP lease has supplied one. No sw_version: no endpoint on this
      firmware is known to return the version string, and a hardcoded one
      would be wrong on every unit but the author's - it waits until the
      panel's web root is enumerated and a real page is found to carry it.
  diagnostics:
    status: done
    comment: |
      Host, credentials and keypad code redacted; everything else about how
      the state got on screen is in. Since 0.4.0 that means naming the source
      the shown status came from and carrying the push stream's own account
      of itself - connected, the firmware's permanent 404 if there is no
      stream at all, the connection id, the client count, how many frames
      have arrived and how far a failing stream has backed off - beside the
      fallback poll's interval and last result. The two sources fail in
      different ways, so a report that named neither could not distinguish a
      stream that never came up from a panel that is not answering at all.
  discovery:
    status: done
    comment: |
      The panel announces nothing over mDNS or SSDP, but it is a DHCP client
      and its lease identifies it. Measured from the UniFi controller on the
      unit at 00:d0:2d:4d:d7:b6 (2026-09-05, wired): OUI 00:D0:2D belongs to
      Resideo (formerly Ademco/Honeywell) and the lease hostname is
      `Tux00D02D4DD7B6` - the literal word Tux followed by the twelve hex
      digits of its own MAC. manifest.json therefore matches
      `{"hostname": "tux*", "macaddress": "00D02D*"}`, both conditions
      together, so another vendor's device on the same OUI is not offered as
      a Tuxedo panel. async_step_dhcp shows a confirm step asking for the web
      credentials, keypad code and partition - everything the lease cannot
      supply - logs in to the panel before creating the entry, and keys it on
      the MAC the lease carried. A panel dismissed with Ignore holds an entry
      on that same MAC, and the step's _abort_if_unique_id_configured keeps
      every later lease renewal from raising the card again.
  discovery-update-info:
    status: done
    comment: |
      manifest.json also asks for `{"registered_devices": true}`, so a panel
      whose lease hostname was changed still starts a flow: the entry's
      device carries the panel's MAC as a CONNECTION_NETWORK_MAC connection
      (alarm_control_panel.py). async_step_dhcp corrects the stored host on
      every entry carrying that MAC - one per partition - and reloads them,
      and an entry that was added by hand, and so was keyed on its address,
      adopts the MAC from the lease. tests/ha/test_config_flow.py drives the
      step for a move, a lease at the address already stored, a renamed
      entry, a two-partition panel, an adoption and the collision that raises
      the duplicate-entry issue; tools/validate_local.py refuses a matcher
      without the step, or registered_devices without the MAC in device info.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: |
      A device-type integration: one config entry is one panel partition and
      one device, created at setup. No device can appear later, so there is
      nothing for a coordinator to notice.
  entity-category:
    status: done
    comment: |
      The alarm panel is the primary entity, for which the default (no
      category) is the correct assignment.
  entity-device-class:
    status: done
    comment: alarm_control_panel has no device classes, so there is nothing to assign.
  entity-disabled-by-default:
    status: exempt
    comment: One entity, and it is the reason to install this.
  entity-translations:
    status: done
    comment: |
      The entity name is the translation key `partition` with the partition
      number as a placeholder.
  exception-translations:
    status: done
    comment: |
      The two entity-facing errors and the four setup and poll errors
      (ConfigEntryAuthFailed, and UpdateFailed for a failed read, for the
      HTTPS redirect and for the panel answering "Not available" instead of
      a status) all carry translation keys; tools/validate_local.py
      refuses an f-string in either place, and refuses an exception key that
      strings.json does not declare or declares unused.
  icon-translations:
    status: done
    comment: |
      No icons.json: alarm_control_panel has no device class, and the
      domain's default state icons are the right ones for an alarm panel.
  reconfiguration-flow:
    status: done
    comment: |
      Address, port, scheme, credentials, code and partition; the entry title
      follows the host unless the user renamed the entry. The check against
      the panel is skipped when nothing the login depends on changed, and
      otherwise runs with the entry unloaded - whether it was polling or
      retrying its setup: the panel serves one client at a time, so a check
      alongside either one hangs and reports cannot_connect on a healthy
      panel. Unloading stops the entry starting new work and waits for the
      poll it already had in flight, so nothing of ours is mid-request when
      the check runs; what then keeps the check off a second connection is
      that every client shares one TLS context and so one connection-pool key,
      leaving the check to reuse the socket the poller left idle in Home
      Assistant's pool.
  repair-issues:
    status: done
    comment: |
      Two persistent, user-actionable conditions raise one. The panel
      redirecting plain-HTTP API calls to HTTPS is fixable: repairs.py flips
      the entry to HTTPS, moves port 80 to 443 and reloads. A second entry
      reaching the same panel is not, because only the user can say which of
      the two to remove; that issue names both entries instead. Both are
      cleared when the condition goes and when the entry is deleted.
  stale-devices:
    status: exempt
    comment: |
      A device-type integration: the one device an entry creates is the panel
      the entry is for, and it is removed with the entry. A device can never
      be stale while the entry that made it exists.

  # Platinum
  async-dependency:
    status: done
    comment: |
      The panel's own client is in this repository (api.py) and is asyncio
      throughout: aiohttp for every request, no thread and no executor job.
      getmac is gone. It was there only because the panel reports no
      identifier of its own - Registration/AddDeviceMAC enrolls a client's
      MAC, not the unit's, and no documented endpoint returns the unit's
      hostname or network configuration - so identity came from a synchronous
      ARP lookup in the executor. The DHCP matcher filed under `discovery`
      replaced it: Home Assistant's own lease watcher hands the MAC over, and
      an install it sees no lease for keeps the address identity the code
      already supported. The one requirement left is cryptography, which does
      AES and PKCS7 on bytes already in memory and performs no I/O, so there
      is no event loop to block.
  inject-websession:
    status: done
    comment: |
      The coordinator takes its session from
      async_create_clientsession(hass, auto_cleanup=False,
      cookie_jar=aiohttp.DummyCookieJar()) and the config flow already did;
      both run on Home Assistant's shared connector and are detached rather
      than closed. The jar is the reason for a session of its own: the panel
      names its session cookie randomly per login and the client sets the
      Cookie header itself. The old dedicated connector's keep-alive tuning
      went with the change - see the README's "How it updates".
  strict-typing:
    status: done
    comment: |
      pyproject.toml sets strict with nothing switched off underneath it and
      no override at all: every dependency this integration imports -
      aiohttp, cryptography, voluptuous and homeassistant - ships py.typed,
      so nothing needs ignore_missing_imports. tools/validate_local.py fails
      the run if strict is dropped or if an override appears that relaxes a
      check, and the Tests workflow runs mypy against the whole integration
      with Home Assistant installed on every push.
