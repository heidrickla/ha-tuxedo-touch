rules:
  # Bronze
  action-setup:
    status: exempt
    comment: This integration does not provide actions.
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage:
    status: done
    comment: |
      tests/ha/test_config_flow.py covers the user step, all four error
      mappings, retry after a failure, the duplicate abort, a second partition,
      reconfigure (address change, partition change, the another_panel guard
      and the collision guard), MAC identity and its address fallback, and
      reauth. Run by the `Home Assistant layer` job of
      .gitea/workflows/validate.yml on the self-hosted runner.
  config-flow: done
  dependency-transparency:
    status: done
    comment: |
      One dependency, `getmac==0.9.5` - open source, on PyPI, pinned, and the
      same pin five core integrations use. It resolves the panel's MAC so the
      config entry's identity survives a DHCP address change.
  docs-actions:
    status: exempt
    comment: This integration does not provide actions.
  docs-conditions:
    status: exempt
    comment: This integration does not provide conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: This integration does not provide triggers.
  entity-event-setup:
    status: exempt
    comment: The entity does not subscribe to events of its own.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: No options flow; the connection details are edited by reconfigure.
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage:
    status: done
    comment: |
      The API session layer has unit tests that run on a bare interpreter.
      tests/ha/ adds the Home Assistant layer: setup, an unreachable panel,
      rejected credentials starting reauth, session closure on both a failed
      setup and unload, the "Not available" firmware quirk, MAC adoption on an
      existing entry, and the panel entity's status map, codes, optimistic
      updates and refusals. 49 tests, run in CI.

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: |
      The panel announces nothing on the network. Its address is entered by
      the user.
  discovery-update-info:
    status: exempt
    comment: Nothing to discover, so no discovery data to update from.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: A panel is a single fixed device.
  entity-category:
    status: exempt
    comment: The alarm panel is the integration's primary entity.
  entity-device-class: done
  entity-disabled-by-default:
    status: exempt
    comment: One entity, and it is the reason to install this.
  entity-translations:
    status: exempt
    comment: |
      A single main entity carrying the device's name, so it sets
      `_attr_name = None` rather than a translation key.
  exception-translations: done
  icon-translations:
    status: exempt
    comment: The alarm panel uses the device class icon.
  reconfiguration-flow: done
  repair-issues:
    status: exempt
    comment: |
      Authentication failure raises a reauth flow. No other condition needs
      user intervention.
  stale-devices:
    status: exempt
    comment: A panel is a single fixed device, removed with the entry.

  # Platinum
  async-dependency:
    status: exempt
    comment: |
      No external dependency; the panel is spoken to over aiohttp directly.
  inject-websession:
    status: exempt
    comment: |
      A dedicated session is required. The panel sets a session cookie with a
      random name per login, so sharing Home Assistant's session would leak
      cookies between integrations.
  strict-typing: done
