name: Validate

# Runs on the self-hosted act_runner on gpurack2. GitHub Actions is unavailable
# (spend cap) and this hardware is already paid for.
#
# THE RUNNER IS SHARED AND ITS CAPACITY IS 1. Other agent sessions queue behind
# anything pushed here, so an ordinary push runs ONE fast job. Anything that
# installs Home Assistant is workflow_dispatch only.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint and structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned: an unpinned linter makes CI non-reproducible, and this exact
      # failure has already been paid for once on the sleepiq repo.
      - name: Install ruff (PINNED)
        run: |
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet "ruff==0.15.21"
          python3 -m ruff --version

      - name: Ruff
        run: |
          python3 -m ruff check .
          python3 -m ruff format --check .

      # No ast.parse step here on purpose. The runner image ships Python
      # 3.10.12 and this integration uses PEP 695 `type X = ...`, which that
      # interpreter cannot parse. Ruff already parses every file at py313.
      - name: JSON is valid
        run: |
          for f in custom_components/tuxedo_touch/*.json hacs.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1],encoding='utf-8'))" "$f" || exit 1
          done
          echo "all JSON valid"

      - name: Manifest sanity
        run: |
          python3 - <<'PY'
          import json
          m = json.load(open("custom_components/tuxedo_touch/manifest.json", encoding="utf-8"))
          missing = [k for k in ("domain","name","version","documentation","codeowners") if not m.get(k)]
          assert not missing, f"manifest missing: {missing}"
          assert m["domain"] == "tuxedo_touch", m["domain"]
          # A custom integration without a version silently fails to load.
          assert m["version"], "version is required for a custom integration"
          print("manifest ok:", m["domain"], m["version"])
          PY

      # The validator needs Python 3.11+ for tomllib; the runner image ships
      # 3.10, so it runs under the same interpreter the Home Assistant job
      # uses.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Quality scale and offline validator
        run: |
          python -m pip install --quiet "PyYAML==6.0.2"
          python tools/validate_local.py

  # Installs Home Assistant, so it is manual only and never occupies the shared
  # runner on an ordinary push. This is the job that runs tests/ha/. The GitHub
  # Tests workflow runs the same steps on every push.
  home-assistant:
    name: Home Assistant layer
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The runner image ships 3.10; Home Assistant 2026.x needs 3.14.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # 0.13.357 pins Home Assistant 2026.8.3 and brings pytest and pytest-cov
      # with it. getmac is the integration's own requirement.
      - name: Install
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet "mypy==1.18.2" \
            "pytest-homeassistant-custom-component==0.13.357" \
            "getmac==0.9.5"

      - name: Unit tests
        run: |
          for t in tests/test_*.py; do
            echo "-- $t"; python "$t" || exit 1
          done

      - name: Home Assistant layer tests
        run: >
          python -m pytest tests/ha -q
          --cov=custom_components/tuxedo_touch --cov-report=term-missing

      - name: mypy strict
        run: python -m mypy custom_components/tuxedo_touch

  # No continue-on-error: a red hassfest or HACS run is the answer, not noise.
  hacs:
    name: hassfest + HACS
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
      - uses: hacs/action@main
        with:
          category: integration
