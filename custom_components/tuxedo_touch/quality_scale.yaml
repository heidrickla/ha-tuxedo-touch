rules:
  # Bronze
  action-setup:
    status: exempt
    comment: |
      This integration registers no actions of its own. Arming and disarming
      go through the alarm_control_panel domain's actions.
  appropriate-polling:
    status: done
    comment: |
      Thirty seconds. The panel is an embedded web server with a legacy TLS
      handshake on every new connection; a command is reflected immediately
      through an optimistic update, so the poll only has to catch changes
      made at the keypad.
  brands:
    status: done
    comment: |
      Brand images ship in-repo at custom_components/tuxedo_touch/brand/,
      which Home Assistant serves from 2026.3 on; hacs.json floors there.
  common-modules: done
  config-flow-test-coverage:
    status: done
    comment: |
      tests/ha/test_config_flow.py covers the user step, the four error
      mappings and recovery from an error to a created entry, the duplicate
      abort, a second partition, reconfigure (address and partition changes,
      recovery from an error, the another_panel and collision guards, blank
      secrets keeping the stored ones, the title following a move, an
      address entry gaining its MAC) and reauth in both outcomes including
      recovery. Run by the GitHub Tests workflow on every push.
  config-flow:
    status: done
    comment: Every field has a data_description; the secrets use a password selector.
  dependency-transparency:
    status: done
    comment: |
      getmac==0.9.5 - open source, on PyPI, the pin five core integrations
      use. cryptography is declared unpinned on purpose: Home Assistant core
      pins it and constrains every install to that pin, so any other version
      here would refuse to install on the next core release.
  docs-actions:
    status: exempt
    comment: This integration registers no actions of its own.
  docs-conditions:
    status: exempt
    comment: This integration provides no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: This integration provides no triggers.
  entity-event-setup:
    status: done
    comment: |
      The entity is a CoordinatorEntity, which subscribes to the coordinator
      in async_added_to_hass and unsubscribes on removal. Nothing else is
      subscribed to.
  entity-unique-id: done
  has-entity-name:
    status: done
    comment: |
      The entity is named "Partition N" under the device name. Two partition
      entries on one panel are two devices with the same name (one device per
      config entry since HA 2026.8), so the partition in the entity name is
      what tells the two alarms apart.
  runtime-data: done
  test-before-configure:
    status: done
    comment: The flow performs a real login before the entry is created.
  test-before-setup:
    status: done
    comment: |
      async_config_entry_first_refresh raises ConfigEntryNotReady while the
      panel is unreachable and ConfigEntryAuthFailed when it refuses the
      credentials.
  unique-config-entry:
    status: done
    comment: |
      The panel's MAC plus the partition where the network resolves it, the
      address plus the partition otherwise; a same-panel re-add is also
      caught on the stored connection data before any network traffic.

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: No options flow; the connection details are edited by reconfigure.
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: |
      The coordinator logs an unreachable panel once, via UpdateFailed, and
      once more when it recovers.
  parallel-updates: done
  reauthentication-flow: done
  test-coverage:
    status: done
    comment: |
      The Tests workflow runs the whole suite under coverage on every push
      and fails below 95% (`--cov-fail-under=95`). tests/test_client_io.py
      covers the client's login, key fetch and call paths through a session
      stand-in; tests/ha covers setup, the entity, the config flow,
      diagnostics, identity, the repair issues and the in-flight poll
      discard. tools/validate_local.py refuses a workflow that drops the
      gate.

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: todo
    comment: |
      This rule is about finding a panel nobody has set up yet, and that is
      the half still open. The panel announces nothing over mDNS or SSDP but
      it is a DHCP client, so a matcher on the Wi-Fi module's OUI or on the
      hostname it puts in its lease would work. Neither has been measured:
      nothing in this repository carries the unit's real MAC prefix or DHCP
      hostname, and a guessed matcher would offer other vendors' devices as
      Tuxedo panels. It needs one reading from a host on the panel's segment.
      The address-update half is done - see discovery-update-info.
  discovery-update-info:
    status: done
    comment: |
      manifest.json asks for `{"registered_devices": true}`, the DHCP
      matcher that fires only for MACs already in the device registry, which
      needs no OUI and no hostname. The entry's device carries the panel's
      MAC as a CONNECTION_NETWORK_MAC connection (alarm_control_panel.py), so
      a lease for that MAC starts async_step_dhcp, which corrects the stored
      host - on every partition entry of the same panel - and reloads.
      tests/ha/test_config_flow.py drives the step for a move, a lease at the
      address already stored, a MAC no entry holds, a renamed entry and a
      two-partition panel; tools/validate_local.py refuses a matcher without
      the step, or registered_devices without the MAC in device info.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: |
      A device-type integration: one config entry is one panel partition and
      one device, created at setup. No device can appear later, so there is
      nothing for a coordinator to notice.
  entity-category:
    status: done
    comment: |
      The alarm panel is the primary entity, for which the default (no
      category) is the correct assignment.
  entity-device-class:
    status: done
    comment: alarm_control_panel has no device classes, so there is nothing to assign.
  entity-disabled-by-default:
    status: exempt
    comment: One entity, and it is the reason to install this.
  entity-translations:
    status: done
    comment: |
      The entity name is the translation key `partition` with the partition
      number as a placeholder.
  exception-translations:
    status: done
    comment: |
      The two entity-facing errors and the three setup and poll errors
      (ConfigEntryAuthFailed, and UpdateFailed for a failed read and for the
      HTTPS redirect) all carry translation keys; tools/validate_local.py
      refuses an f-string in either place, and refuses an exception key that
      strings.json does not declare or declares unused.
  icon-translations:
    status: done
    comment: |
      No icons.json: alarm_control_panel has no device class, and the
      domain's default state icons are the right ones for an alarm panel.
  reconfiguration-flow:
    status: done
    comment: |
      Address, port, scheme, credentials, code and partition; the entry title
      follows the host unless the user renamed the entry.
  repair-issues:
    status: done
    comment: |
      Two persistent, user-actionable conditions raise one. The panel
      redirecting plain-HTTP API calls to HTTPS is fixable: repairs.py flips
      the entry to HTTPS, moves port 80 to 443 and reloads. A second entry
      reaching the same panel is not, because only the user can say which of
      the two to remove; that issue names both entries instead. Both are
      cleared when the condition goes and when the entry is deleted.
  stale-devices:
    status: exempt
    comment: |
      A device-type integration: the one device an entry creates is the panel
      the entry is for, and it is removed with the entry. A device can never
      be stale while the entry that made it exists.

  # Platinum
  async-dependency:
    status: todo
    comment: |
      The panel's own client is in this repository and is asyncio throughout.
      The one synchronous dependency left is getmac, which runs in the
      executor and exists because the panel reports no identifier of its own:
      Registration/AddDeviceMAC enrolls a client's MAC, not the unit's, and
      no endpoint returns the unit's network configuration. An ARP lookup is
      an operating-system call with no asyncio equivalent in Home Assistant
      or on PyPI that does not want raw sockets, so this cannot be closed by
      swapping libraries. The routes out are a panel-side identifier found by
      reading a real unit, or the OUI/hostname DHCP matcher blocked under
      `discovery`, which would have Home Assistant hand over the MAC at setup.
      The registered_devices matcher this integration does ship cannot: it
      only fires for a MAC the integration already holds. The rule allows no
      exemption, so it stays todo rather than being filed as met.
  inject-websession:
    status: done
    comment: |
      The coordinator takes its session from
      async_create_clientsession(hass, auto_cleanup=False,
      cookie_jar=aiohttp.DummyCookieJar()) and the config flow already did;
      both run on Home Assistant's shared connector and are detached rather
      than closed. The jar is the reason for a session of its own: the panel
      names its session cookie randomly per login and the client sets the
      Cookie header itself. The old dedicated connector's keep-alive tuning
      went with the change - see the README's "How it updates".
  strict-typing:
    status: done
    comment: |
      pyproject.toml sets strict with nothing switched off underneath it: the
      file's one override is ignore_missing_imports scoped to getmac, which
      ships no stubs, and supplying types for a dependency relaxes no check
      here. tools/validate_local.py fails the run if strict is dropped or if
      any override carries a key other than that one, and the Tests workflow
      runs mypy against the whole integration with Home Assistant installed
      on every push.
