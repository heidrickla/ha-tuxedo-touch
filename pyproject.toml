[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The test file is a linear check script rather than a module.
"tests/*" = ["S101", "E501"]

# Home Assistant runs mypy in strict mode over integrations claiming the
# strict-typing rule. This block is the real strict configuration and it is
# what the Tests workflow runs with Home Assistant installed. A local run
# without Home Assistant sees every class it exports as Any, so it reports
# subclassing-Any and the `domain=` keyword on ConfigFlow; those are artifacts
# of the missing package, not defects, and CI is the run that counts.
[tool.mypy]
# Home Assistant 2026.x is written for 3.14; a lower target makes mypy stop
# at its own source before reaching this integration.
python_version = "3.14"
# No error code is disabled and nothing is excused: the single override below
# supplies missing types for one dependency and switches no check off.
strict = true
# Third-party code is analysed but its own errors are not reported. It decides
# which FILES are reported on, not how strictly this integration is checked;
# without it a run over this package reports Home Assistant's own source.
follow_imports = "silent"

# getmac 0.9.5 ships no py.typed and no stub package exists, so mypy can find
# no types for that one import. Checked against the wheels: aiohttp,
# cryptography, voluptuous and homeassistant all ship py.typed, so nothing
# else needs this. What getmac returns is annotated at the call site in
# identity.py.
[[tool.mypy.overrides]]
module = ["getmac", "getmac.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
