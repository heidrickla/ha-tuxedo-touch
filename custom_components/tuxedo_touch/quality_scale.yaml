rules:
  # Bronze
  action-setup:
    status: exempt
    comment: |
      This integration registers no actions of its own. Arming and disarming
      go through the alarm_control_panel domain's actions.
  appropriate-polling:
    status: done
    comment: |
      Thirty seconds. The panel is an embedded web server with a legacy TLS
      handshake on every new connection; a command is reflected immediately
      through an optimistic update, so the poll only has to catch changes
      made at the keypad.
  brands:
    status: done
    comment: |
      Brand images ship in-repo at custom_components/tuxedo_touch/brand/,
      which Home Assistant serves from 2026.3 on; hacs.json floors there.
  common-modules: done
  config-flow-test-coverage:
    status: done
    comment: |
      tests/ha/test_config_flow.py covers the user step, the four error
      mappings and recovery from an error to a created entry, the duplicate
      abort, a second partition, reconfigure (address and partition changes,
      recovery from an error, the another_panel and collision guards, blank
      secrets keeping the stored ones, the title following a move, an
      address entry gaining its MAC) and reauth in both outcomes including
      recovery. Run by the GitHub Tests workflow on every push.
  config-flow:
    status: done
    comment: Every field has a data_description; the secrets use a password selector.
  dependency-transparency:
    status: done
    comment: |
      getmac==0.9.5 - open source, on PyPI, the pin five core integrations
      use. cryptography is declared unpinned on purpose: Home Assistant core
      pins it and constrains every install to that pin, so any other version
      here would refuse to install on the next core release.
  docs-actions:
    status: exempt
    comment: This integration registers no actions of its own.
  docs-conditions:
    status: exempt
    comment: This integration provides no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: This integration provides no triggers.
  entity-event-setup:
    status: done
    comment: |
      The entity is a CoordinatorEntity, which subscribes to the coordinator
      in async_added_to_hass and unsubscribes on removal. Nothing else is
      subscribed to.
  entity-unique-id: done
  has-entity-name:
    status: done
    comment: |
      The entity is named "Partition N" under the device name. Two partition
      entries on one panel are two devices with the same name (one device per
      config entry since HA 2026.8), so the partition in the entity name is
      what tells the two alarms apart.
  runtime-data: done
  test-before-configure:
    status: done
    comment: The flow performs a real login before the entry is created.
  test-before-setup:
    status: done
    comment: |
      async_config_entry_first_refresh raises ConfigEntryNotReady while the
      panel is unreachable and ConfigEntryAuthFailed when it refuses the
      credentials.
  unique-config-entry:
    status: done
    comment: |
      The panel's MAC plus the partition where the network resolves it, the
      address plus the partition otherwise; a same-panel re-add is also
      caught on the stored connection data before any network traffic.

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: No options flow; the connection details are edited by reconfigure.
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: |
      The coordinator logs an unreachable panel once, via UpdateFailed, and
      once more when it recovers.
  parallel-updates: done
  reauthentication-flow: done
  test-coverage:
    status: todo
    comment: |
      Coverage is reported by the Tests workflow but not yet gated, and
      known gaps remain: diagnostics.py, the coordinator's in-flight poll
      discard, and the client's login and _call network paths. Raising it to
      95% and adding the gate is the next step.

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: todo
    comment: |
      The panel announces nothing over mDNS or SSDP, but it is a DHCP client,
      and DHCP discovery needs only a stable OUI. The Wi-Fi module's OUI has
      not been measured from a LAN host; a dhcp matcher waits on that.
  discovery-update-info:
    status: todo
    comment: Follows discovery.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: A panel is a single fixed device.
  entity-category:
    status: done
    comment: |
      The alarm panel is the primary entity, for which the default (no
      category) is the correct assignment.
  entity-device-class:
    status: done
    comment: alarm_control_panel has no device classes, so there is nothing to assign.
  entity-disabled-by-default:
    status: exempt
    comment: One entity, and it is the reason to install this.
  entity-translations:
    status: done
    comment: |
      The entity name is the translation key `partition` with the partition
      number as a placeholder.
  exception-translations:
    status: done
    comment: |
      The two entity-facing errors and the two setup and poll errors
      (ConfigEntryAuthFailed, UpdateFailed) all carry translation keys;
      tools/validate_local.py refuses an f-string in either place.
  icon-translations:
    status: done
    comment: |
      No icons.json: alarm_control_panel has no device class, and the
      domain's default state icons are the right ones for an alarm panel.
  reconfiguration-flow:
    status: done
    comment: |
      Address, port, scheme, credentials, code and partition; the entry title
      follows the host unless the user renamed the entry.
  repair-issues:
    status: todo
    comment: |
      Two persistent, user-actionable conditions surface only as errors and
      log lines: the panel redirecting plain-HTTP API calls to HTTPS (fix is
      to reconfigure with HTTPS on) and a second entry reaching the same
      panel (fix is to remove one). Both want a repair issue.
  stale-devices:
    status: exempt
    comment: A panel is a single fixed device, removed with the entry.

  # Platinum
  async-dependency:
    status: todo
    comment: |
      getmac is synchronous and runs in the executor. The rule allows no
      exemption; an asynchronous ARP source, or dropping the lookup in favour
      of another identity, is open.
  inject-websession:
    status: todo
    comment: |
      The coordinator builds its own aiohttp.ClientSession, for a
      DummyCookieJar and a keep-alive longer than the poll interval.
      async_create_clientsession(hass, cookie_jar=aiohttp.DummyCookieJar())
      would satisfy the rule at the cost of the connector tuning; whether
      that tuning is worth keeping has not been measured against the panel.
  strict-typing:
    status: todo
    comment: |
      pyproject.toml is strict with no relaxations and the Tests workflow
      runs mypy with Home Assistant installed on every push. Marked done on
      the first green run; until then the claim is unverified.
