[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The test file is a linear check script rather than a module.
"tests/*" = ["S101", "E501"]

# Home Assistant runs mypy in strict mode over integrations claiming the
# strict-typing rule.
[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_reexport = true
ignore_missing_imports = true
follow_imports = "silent"
# Relaxed only because Home Assistant is not installed here: without it every
# class it exports is Any, so subclassing Entity reads as subclassing Any and
# @callback reads as an untyped decorator.
disallow_subclassing_any = false
disallow_untyped_decorators = false
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = "tests.*"
strict = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
