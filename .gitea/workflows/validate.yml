name: Validate

# Runs on a self-hosted act_runner. GitHub Actions is unavailable
# (spend cap) and this hardware is already paid for.
#
# THE RUNNER IS SHARED AND ITS CAPACITY IS 1. Other agent sessions queue behind
# anything pushed here, so an ordinary push runs ONE fast job. Anything that
# installs Home Assistant is workflow_dispatch only.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint and structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        timeout-minutes: 15

      # The validator needs Python 3.11+ for tomllib; this is the interpreter
      # the Home Assistant job uses.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        timeout-minutes: 15
        with:
          python-version: "3.14"

      # A venv of the job's own: the image's Python is externally managed, and
      # the runner's toolcache Python carries other repos' packages.
      # Pinned: an unpinned linter makes CI non-reproducible, and this exact
      # failure has already been paid for once on the sleepiq repo.
      - name: Install ruff and PyYAML (PINNED)
        timeout-minutes: 15
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet "ruff==0.15.21" "PyYAML==6.0.2"
          "$RUNNER_TEMP/venv/bin/python" -m ruff --version

      - name: Ruff
        timeout-minutes: 15
        run: |
          "$RUNNER_TEMP/venv/bin/python" -m ruff check .
          "$RUNNER_TEMP/venv/bin/python" -m ruff format --check .

      - name: JSON is valid
        timeout-minutes: 15
        run: |
          for f in custom_components/tuxedo_touch/*.json hacs.json; do
            "$RUNNER_TEMP/venv/bin/python" -c "import json,sys; json.load(open(sys.argv[1],encoding='utf-8'))" "$f" || exit 1
          done
          echo "all JSON valid"

      - name: Manifest sanity
        timeout-minutes: 15
        run: |
          "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          import json
          m = json.load(open("custom_components/tuxedo_touch/manifest.json", encoding="utf-8"))
          missing = [k for k in ("domain","name","version","documentation","codeowners") if not m.get(k)]
          assert not missing, f"manifest missing: {missing}"
          assert m["domain"] == "tuxedo_touch", m["domain"]
          # A custom integration without a version silently fails to load.
          assert m["version"], "version is required for a custom integration"
          print("manifest ok:", m["domain"], m["version"])
          PY

      - name: Quality scale and offline validator
        timeout-minutes: 15
        run: |
          "$RUNNER_TEMP/venv/bin/python" tools/validate_local.py

  # Installs Home Assistant, so it is manual only and never occupies the shared
  # runner on an ordinary push. This is the job that runs tests/ha/. The GitHub
  # Tests workflow runs the same steps on every push.
  home-assistant:
    name: Home Assistant layer
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        timeout-minutes: 15

      # Home Assistant 2026.x needs 3.14.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        timeout-minutes: 15
        with:
          python-version: "3.14"

      # 0.13.357 pins Home Assistant 2026.8.3 and brings pytest and pytest-cov
      # with it, along with cryptography, which the integration imports.
      - name: Install
        timeout-minutes: 15
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet "mypy==1.18.2" \
            "pytest-homeassistant-custom-component==0.13.357"

      # A check() script rather than pytest functions, so running it directly
      # is the honest invocation. Everything else in tests/ is pytest.
      - name: Pure tests
        timeout-minutes: 15
        run: python tests/test_api.py

      - name: Tests and coverage
        timeout-minutes: 15
        run: >
          python -m pytest --durations=15 --junitxml=reports/junit-1.xml tests -q
          --cov=custom_components/tuxedo_touch --cov-report=term-missing
          --cov-fail-under=95

      - name: mypy strict
        timeout-minutes: 15
        run: python -m mypy custom_components/tuxedo_touch

      # each test's time and result, kept whatever the outcome: the forge shows no job log
      - name: test results
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: test-results-${{ github.job }}
          path: reports/
          retention-days: 14

  # No continue-on-error: a red hassfest run is the answer, not noise.
  # hacs/action reads the repository through the GitHub API, so it cannot
  # check this tree here; .github/workflows/validate.yml runs it on GitHub.
  hassfest:
    name: hassfest
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        timeout-minutes: 15
      - uses: home-assistant/actions/hassfest@cd6f3635a740c84d8a14f6121a90068b8ece6bf6 # master
        timeout-minutes: 15
